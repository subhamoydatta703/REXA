name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun x tsc --noEmit -p tsconfig.json
      - name: Web workflow regression tests
        run: bun run test:web
      - name: Install headless Chromium
        run: bunx playwright install --with-deps chromium --only-shell
      - name: Browser rendering integration tests
        run: bun run test:web:browser
