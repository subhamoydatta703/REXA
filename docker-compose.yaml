# Secure code-execution sandbox for the agent.
services:
    sandbox:
        build:
            context: .
            dockerfile: sandbox.Dockerfile
        image: my_agent_adk_sandbox:latest
        working_dir: /app

        # Workspace-only mount. The agent can only ever touch this directory tree.
        volumes:
            - type: bind
              source: ${REXA_WORKSPACE:-.}
              target: /app
            - sandbox_workspace:/workspace

        # Run as a non-root user (the "bun" user in the image is UID 1000).
        user: "1000:1000"

        # Set REXA_SANDBOX_NETWORK=none to disable container network access.
        network_mode: ${REXA_SANDBOX_NETWORK:-bridge}
        security_opt:
            - no-new-privileges:true

        # Drop every Linux capability.
        cap_drop:
            - ALL

        # Kill the init process when the main entry (tail) exits, and reap zombies so
        # stray child processes can't accumulate.
        init: true

        # Harden the process tree.
        deploy:
            resources:
                limits:
                    cpus: ${REXA_SANDBOX_CPUS:-1}
                    memory: ${REXA_SANDBOX_MEMORY:-1G}
                    pids: 128

        # No provider keys or Docker socket are injected. The writable /app bind
        # mount DOES expose workspace files, including any credentials stored there.
        # File-tool protection does not restrict an approved container command.

        # Keep the container alive so `docker compose exec` can run commands in it.
        command: ["tail", "-f", "/dev/null"]

volumes:
    sandbox_workspace:
